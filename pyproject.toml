[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravtide3d"
version = "0.1.0"
description = "Gravitational potential and tidal eigensystems from 3-D density fields"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "GravTide3D contributors"}
]
dependencies = [
  "numpy>=1.24",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
# CUDA-specific CuPy wheels are installed separately by the user.
# See README.md for CUDA 12 / CUDA 13 installation instructions.
dev = ["pytest>=8", "jupyter>=1", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
